<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 1st Anniversary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importing Caveat for text and Lora for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F5F5F7;
            color: #333333;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-caveat {
            font-family: 'Caveat', cursive;
        }

        .font-lora {
            font-family: 'Lora', serif;
        }

        .fade-element {
            opacity: 1;
            transition: opacity 1.2s ease-in-out;
        }

        .fade-out {
            opacity: 0;
        }

        /* ปรับแต่งรูปภาพให้เป็นสไตล์โพลารอยด์ */
        .story-image {
            max-width: 90%; 
            max-height: 55vh; 
            width: auto;
            height: auto;
            object-fit: cover;
            box-sizing: border-box;
            
            /* เอฟเฟกต์โพลารอยด์ */
            background-color: #ffffff;
            padding: 12px 12px 60px 12px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* เอฟเฟกต์หัวใจลอย */
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        .heart {
            position: absolute;
            bottom: -10vh;
            color: #ff4d4d;
            pointer-events: none;
            animation: floatUp linear forwards;
            z-index: 100;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-center items-center cursor-pointer relative" onclick="nextSlide()">

    <!-- Audio Element -->
    <audio id="bg-music" loop preload="auto">
        <!-- Romantic background music -->
        <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
    </audio>

    <!-- ปุ่มเปิด/ปิดเสียง -->
    <button id="audio-btn" onclick="toggleAudio(event)" class="absolute top-6 right-6 z-50 p-3 bg-white/80 backdrop-blur shadow-md rounded-full transition-all duration-1000 opacity-0 hidden hover:scale-110 active:scale-95">
        <!-- ไอคอนเปิดเสียง -->
        <svg id="icon-on" class="w-5 h-5 text-[#333333]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path>
        </svg>
        <!-- ไอคอนปิดเสียง -->
        <svg id="icon-off" class="w-5 h-5 text-[#333333] hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h2.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
        </svg>
    </button>

    <!-- พื้นที่สำหรับสร้างหัวใจลอย -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>

    <!-- Main Content Area -->
    <div id="content-container" class="fade-element w-full max-w-3xl px-6 md:px-12 flex flex-col items-center justify-center text-center relative z-10">
        
        <!-- Image -->
        <img id="story-image" src="https://i.ibb.co/8LgGTdV3/IMG-9828.jpg" alt="Memory" class="story-image mb-6 md:mb-10">
        
        <!-- Text using Caveat font (ปรับขนาดให้เล็กลงที่นี่ text-base md:text-xl) -->
        <p id="story-text" class="font-caveat text-base md:text-xl leading-relaxed md:leading-loose font-medium text-[#333333]">
            Happy anniversary naka tee rak. 397 days of loving you.
        </p>

    </div>

    <!-- Indicator using Lora font -->
    <div id="indicator" class="font-lora absolute bottom-6 text-[#888888] text-xs md:text-sm tracking-widest uppercase fade-element">
        Tap anywhere to continue
    </div>

    <script>
        // Story Data (14 Pages)
        const story = [
            {
                img: "https://i.ibb.co/8LgGTdV3/IMG-9828.jpg",
                text: "Happy anniversary naka tee rak. 397 days of loving you."
            },
            {
                img: "https://i.ibb.co/SwcjWRDP/885a81b9ccceeb3172d73503578680b7.jpg",
                text: "Sometimes, I still can't believe how far we've come. Long-distance isn't always easy, but every moment, every mile, and every day apart has been worth it because I have you. And if I had to do it all over again, I'd still choose you every single time."
            },
            {
                img: "https://i.ibb.co/DfXK37mv/IMG-0866.png",
                text: "Our story is made of late-night video calls, sleepy smiles, and waking up to your “good morning” texts. ❤️ Even though we're miles apart, you still make me feel loved in the little moments every single day"
            },
            {
                img: "https://i.ibb.co/3mgzvdWb/IMG-1045.jpg",
                text: "Do you remember how excited we were, counting down the days until we could finally see each other?"
            },
            {
                img: "https://i.ibb.co/7dBRtMhw/IMG-3840.jpg",
                text: "I'll never forget the excitement of waiting to see you. But somehow, whenever we're finally together, time always seems to fly by. We spend so long waiting for those moments, yet no matter how much time we have, it never feels like enough."
            },
            {
                img: "https://i.ibb.co/7t8rJMVt/f85ba1319be1824b549a86b476be49d5.jpg",
                text: "Do you remember the first time we met? I'm so glad I made the decision to see you that day. Looking back, I know I would've regretted it so much if I hadn't. Because meeting you turned out to be one of the best decisions I've ever made."
            },
            {
                img: "https://i.ibb.co/GvTqghhh/ee27879ded475385bbcb85f201ae99ed-1.jpg",
                text: "I never thought we'd get a second chance to see each other again, but here we are, making more memories together."
            },
            {
                img: "https://i.ibb.co/YBDZyWJZ/IMG-6201.jpg",
                text: "This time together has been filled with so many unexpected moments, little adventures, and memories I'll always hold close to my heart."
            },
            {
                img: "https://i.ibb.co/ycxT6hXn/IMG-3627.jpg",
                text: "But we always leave with a promise of 'See you soon,' and a brand new countdown begins."
            },
            {
                img: "https://i.ibb.co/KxhcRPdR/IMG-0091.jpg",
                text: "Today marks exactly one year+++ of us :). One year of choosing each other every single day, despite the distance."
            },
            {
                img: "https://i.ibb.co/ywRxCHB/IMG-3756.jpg",
                text: "Looking back at all our pictures, I realize how much we've grown together and how strong our love has become."
            },
            {
                img: "https://i.ibb.co/MD59Tr4w/IMG-1204.png",
                text: "I can't wait for the day when there are no more airport goodbyes, no more countdowns, and no more screens between us."
            },
            {
                img: "https://i.ibb.co/84jbMtBq/IMG-1232.jpg",
                text: "Thank you for your endless patience, your warmth, and for making me the happiest person."
            },
            {
                img: "https://i.ibb.co/TMs594td/IMG-3724.jpg",
                text: "Happy 1st anniversary, teerak. ❤️ I'm just a little sad that I didn't get to send this to you on our actual anniversary, but that doesn't change how much I love you. Here's to many more years, more adventures, and more beautiful memories together. I love you always, and I'll see you in December!"
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;
        let isMusicPlaying = false;
        let heartInterval;

        const container = document.getElementById('content-container');
        const imgEl = document.getElementById('story-image');
        const textEl = document.getElementById('story-text');
        const indicator = document.getElementById('indicator');
        const bgMusic = document.getElementById('bg-music');
        const audioBtn = document.getElementById('audio-btn');
        const iconOn = document.getElementById('icon-on');
        const iconOff = document.getElementById('icon-off');
        const heartsContainer = document.getElementById('hearts-container');

        // ฟังก์ชันสำหรับสลับเปิด/ปิดเพลง
        function toggleAudio(event) {
            event.stopPropagation(); 
            if (bgMusic.paused) {
                bgMusic.play();
                iconOff.classList.add('hidden');
                iconOn.classList.remove('hidden');
            } else {
                bgMusic.pause();
                iconOn.classList.add('hidden');
                iconOff.classList.remove('hidden');
            }
        }

        // ฟังก์ชันสร้างหัวใจลอย
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's'; 
            
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // Preload images for smooth transitions
        function preloadImages() {
            story.forEach(slide => {
                const img = new Image();
                img.src = slide.img;
            });
        }
        
        window.onload = preloadImages;

        function nextSlide() {
            if (!isMusicPlaying) {
                bgMusic.play().catch(e => console.log("Audio autoplay blocked or failed."));
                isMusicPlaying = true;
                
                audioBtn.classList.remove('hidden');
                setTimeout(() => {
                    audioBtn.classList.remove('opacity-0');
                }, 50);
            }

            if (isAnimating) return;

            if (currentIndex >= story.length - 1) {
                return;
            }

            isAnimating = true;
            container.classList.add('fade-out');

            setTimeout(() => {
                currentIndex++;
                
                imgEl.src = story[currentIndex].img;
                textEl.innerText = story[currentIndex].text;

                if (currentIndex === story.length - 1) {
                    indicator.classList.add('fade-out'); 
                    
                    if (!heartInterval) {
                        heartInterval = setInterval(createHeart, 400); 
                    }
                }

                container.classList.remove('fade-out');
                
                setTimeout(() => {
                    isAnimating = false;
                }, 1200);

            }, 1200); 
        }
    </script>
</body>
</html>
